# E-SP-Line2 Backend Configuration

# Server settings
host: "0.0.0.0"
port: 8080
version: "1.0.0"

# HTTP hardening.
#
# allowed_origins is the browser-origin allow-list shared by CORS and the
# WebSocket handshake. It is NOT a same-origin allow-list: a deployment served
# behind one reverse proxy needs no entries at all, because the browser then
# sends no Origin. The defaults exist for the Vite dev server (make
# build-frontend-dev / run-desktop) only — replace them with your UI host when
# the UI lives somewhere else. An entry of "*" allows any origin.
#
# The timeouts are seconds; 0 disables the corresponding net/http timeout.
# Active WebSocket connections are unaffected (the upgrade takes the socket off
# these deadlines), so read_timeout/write_timeout do not cut long-lived sockets.
server:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  read_header_timeout: 5
  read_timeout: 60
  write_timeout: 60
  idle_timeout: 120
  max_body_bytes: 8388608  # 8 MiB; adapter configs are JSON blobs, not files

# Database settings
database:
  driver: "sqlite"  # sqlite or postgres
  dsn: "data/e-sp-line2.db"
  # For PostgreSQL:
  # host: "localhost"
  # port: 5432
  # user: "esp"
  # password: ""
  # dbname: "esp_line2"
  # sslmode: "disable"

# Redis settings
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# Log settings
log_level: "info"  # debug, info, warn, error

# JWT settings
#
# Change the secret before exposing the API. Startup logs a WARN while this is
# still the shipped value, because every copy of the repository has it and
# tokens are HS256-signed with it.
jwt:
  secret: "change-this-secret-in-production"
  expiration: 24  # hours

# Adapter settings
adapter:
  heartbeat_interval: 30  # seconds
  reconnect_delay: 5      # seconds
  max_retries: 3
  message_queue_size: 1000

  # Python 接入器进程管理（WebUI 启动/停止）
  python_bin: "python3"          # Python 可执行文件路径（建议指向 venv 中的 python）
  adapters_dir: "adapters"       # 接入器根目录（含 adapters/<platform>/main.py）
  auto_restart: true             # Python 进程异常退出后是否自动重启
