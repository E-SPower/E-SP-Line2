# E-SP-Line2 Backend Configuration

# Server settings
host: "0.0.0.0"
port: 8080
version: "1.0.0"

# Database settings
database:
  driver: "sqlite"  # sqlite or postgres
  dsn: "data/e-sp-line2.db"
  # For PostgreSQL:
  # host: "localhost"
  # port: 5432
  # user: "esp"
  # password: ""
  # dbname: "esp_line2"
  # sslmode: "disable"

# Redis settings
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# Log settings
log_level: "info"  # debug, info, warn, error

# JWT settings
jwt:
  # The shipped value is a placeholder: while it is in place startup logs a
  # WARN and anyone can forge a token. Generate one per deployment, e.g.
  #   openssl rand -base64 32
  secret: "change-this-secret-in-production"
  expiration: 24  # hours

# HTTP server settings — all seconds, 0 disables a timeout.
server:
  read_header_timeout: 10
  read_timeout: 60
  write_timeout: 120
  idle_timeout: 120
  max_body_bytes: 4194304  # 4 MiB

# Browser security. One allowlist, used by CORS *and* the WebSocket Origin
# check. Add the real front-end Origin when the UI is served from elsewhere;
# ESP_SECURITY_ALLOWED_ORIGINS (comma-separated) overrides this list. An empty
# list means "allow any Origin" (development fallback).
security:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

# Adapter settings
adapter:
  heartbeat_interval: 30  # seconds
  reconnect_delay: 5      # seconds
  max_retries: 3
  message_queue_size: 1000

  # Python 接入器进程管理（WebUI 启动/停止）
  python_bin: "python3"          # Python 可执行文件路径（建议指向 venv 中的 python）
  adapters_dir: "adapters"       # 接入器根目录（含 adapters/<platform>/main.py）
  auto_restart: true             # Python 进程异常退出后是否自动重启
