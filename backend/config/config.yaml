# E-SP-Line2 Backend Configuration

# Server settings
host: "0.0.0.0"
port: 8080
version: "1.0.0"

# Database settings
database:
  driver: "sqlite"  # sqlite or postgres
  dsn: "data/e-sp-line2.db"
  # For PostgreSQL:
  # host: "localhost"
  # port: 5432
  # user: "esp"
  # password: ""
  # dbname: "esp_line2"
  # sslmode: "disable"

# Redis settings
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# Log settings
log_level: "info"  # debug, info, warn, error

# JWT settings
jwt:
  secret: "change-this-secret-in-production"
  expiration: 24  # hours

# Adapter settings
adapter:
  heartbeat_interval: 30  # seconds
  reconnect_delay: 5      # seconds
  max_retries: 3
  message_queue_size: 1000
